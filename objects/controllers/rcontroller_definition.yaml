apiVersion: v1
kind: ReplicationController
metadata:
  name: myapp_rc_01
  labels:
    app: myapp
    type: myapp_rc
    tier: front-end

spec:
  replicas: 3
  template:
    metadata:
      name: my_pod
      labels:
        type: pod-test
    spec:
      containers:
        - name: nginx
          image: nginx:latest
